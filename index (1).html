<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение для Софы 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(165deg, #fff0f5 0%, #ffe4ec 40%, #e8f4ff 100%);
      min-height: 100vh;
      color: #2d2d2d;
      overflow-x: hidden;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .step {
      display: none;
      animation: fadeIn 0.45s ease;
      flex-direction: column;
    }
    .step.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      line-height: 1.35;
      margin-bottom: 12px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .big-question {
      text-align: center;
      margin-top: 40px;
    }
    .big-question h1 {
      font-size: 28px;
      margin-bottom: 40px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }
    .btn {
      padding: 18px 24px;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-yes {
      background: linear-gradient(135deg, #ff6b9d, #ff4d8d);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
    }
    .btn-yes:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 107, 157, 0.5); }
    .btn-no {
      background: white;
      color: #666;
      border: 2px solid #eee;
    }
    .btn-no:hover { background: #f9f9f9; }

    .pon-screen {
      text-align: center;
      margin-top: 80px;
    }
    .pon-screen h1 {
      font-size: 72px;
      color: #ff6b9d;
    }

    .time-form {
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 40px rgba(255, 107, 157, 0.12);
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #f0f0f0;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      background: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #ff6b9d;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .option-card {
      background: white;
      border: 3px solid #f0f0f0;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }
    .option-card:hover { transform: translateY(-4px); }
    .option-card.selected {
      border-color: #ff6b9d;
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.25);
    }
    .option-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
    }
    .option-card .label {
      padding: 12px 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .selected-count {
      text-align: center;
      font-size: 14px;
      color: #ff6b9d;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .love-screen {
      text-align: center;
      margin-top: 60px;
    }
    .love-screen h1 {
      font-size: 32px;
      color: #ff4d8d;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .hearts {
      font-size: 48px;
      letter-spacing: 12px;
      margin: 30px 0;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .summary-box {
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 40px rgba(255, 107, 157, 0.15);
      text-align: center;
    }
    .summary-box h2 {
      color: #ff4d8d;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .summary-item {
      background: #fff5f8;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      text-align: left;
      font-size: 15px;
    }
    .summary-item strong {
      color: #ff4d8d;
    }
    .couple-photo {
      width: 100%;
      border-radius: 18px;
      margin: 20px 0;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .final-hearts {
      font-size: 32px;
      margin-top: 10px;
    }

    .btn-next {
      background: linear-gradient(135deg, #ff6b9d, #ff4d8d);
      color: white;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.35);
    }
    .btn-next:hover { transform: translateY(-2px); }
    .btn-next:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .progress {
      height: 6px;
      background: #ffe0eb;
      border-radius: 10px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b9d, #ff4d8d);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- STEP 1 -->
    <div class="step active" id="step1">
      <div class="progress"><div class="progress-fill" style="width: 20%"></div></div>
      <div class="big-question">
        <h1>Ты приглашаешь меня<br>к себе? 🥺</h1>
        <div class="btn-group">
          <button class="btn btn-yes" onclick="goToStep(2)">Да ❤️</button>
          <button class="btn btn-no" onclick="goToStep('pon')">Нет</button>
        </div>
      </div>
    </div>

    <!-- ПОН -->
    <div class="step" id="step-pon">
      <div class="pon-screen">
        <h1>пон</h1>
        <p style="margin-top: 20px; color: #888; font-size: 18px;">ну и ладно...</p>
        <button class="btn btn-next" style="margin-top: 40px;" onclick="goToStep(1)">Вернуться</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step2">
      <div class="progress"><div class="progress-fill" style="width: 40%"></div></div>
      <h1>Когда приходить? 🕐</h1>
      <p class="subtitle">Выбери удобное время</p>
      <div class="time-form">
        <div class="form-group">
          <label>Дата</label>
          <input type="date" id="dateInput">
        </div>
        <div class="form-group">
          <label>Время</label>
          <input type="time" id="timeInput">
        </div>
        <button class="btn btn-next" onclick="saveTimeAndNext()">Далее →</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step" id="step3">
      <div class="progress"><div class="progress-fill" style="width: 60%"></div></div>
      <h1>Что будем делать? ✨</h1>
      <p class="subtitle">Можно выбрать до 3 вариантов</p>
      <div class="selected-count" id="selectedCount">Выбрано: 0 / 3</div>
      <div class="options-grid" id="optionsGrid"></div>
      <button class="btn btn-next" id="btnStep3" disabled onclick="goToStep(4)">Далее →</button>
    </div>

    <!-- STEP 4 -->
    <div class="step" id="step4">
      <div class="progress"><div class="progress-fill" style="width: 80%"></div></div>
      <div class="love-screen">
        <h1>Софа<br>я тебя ооочень<br>сильно люблю</h1>
        <div class="hearts">❤️ ❤️ ❤️</div>
        <button class="btn btn-next" onclick="goToStep(5)">Нажми 💕</button>
      </div>
    </div>

    <!-- STEP 5 -->
    <div class="step" id="step5">
      <div class="progress"><div class="progress-fill" style="width: 100%"></div></div>
      <div class="summary-box">
        <h2>Всё готово 💌</h2>
        <div class="summary-item">
          <strong>Когда:</strong> <span id="sumDate">—</span>
        </div>
        <div class="summary-item">
          <strong>Что будем делать:</strong><br>
          <span id="sumChoices">—</span>
        </div>
        <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600&q=80" alt="Мы" class="couple-photo">
        <div class="final-hearts">💗 💕 💗</div>
        <p style="margin-top: 16px; color: #888; font-size: 14px;">Жду тебя, Софа ❤️</p>
      </div>
    </div>

  </div>

  <script>
    let selectedTime = { date: '', time: '' };
    let selectedOptions = [];

    const options = [
      { id: 'pizza', label: 'Пицца', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400&q=80' },
      { id: 'burger', label: 'Бургеры', img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80' },
      { id: 'pasta', label: 'Паста', img: 'https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=400&q=80' },
      { id: 'gift', label: 'Подарок', img: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400&q=80' },
      { id: '18plus', label: '18+', img: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&q=80' },
      { id: 'other', label: 'Ещё что-то', img: 'https://images.unsplash.com/photo-1511988617509-a57c8a105843?w=400&q=80' }
    ];

    function renderOptions() {
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.dataset.id = opt.id;
        card.innerHTML = `
          <img src="${opt.img}" alt="${opt.label}">
          <div class="label">${opt.label}</div>
        `;
        card.onclick = () => toggleOption(opt.id, card);
        grid.appendChild(card);
      });
    }

    function toggleOption(id, card) {
      const index = selectedOptions.indexOf(id);
      if (index > -1) {
        selectedOptions.splice(index, 1);
        card.classList.remove('selected');
      } else {
        if (selectedOptions.length >= 3) return;
        selectedOptions.push(id);
        card.classList.add('selected');
      }
      updateSelectedCount();
    }

    function updateSelectedCount() {
      document.getElementById('selectedCount').textContent = `Выбрано: ${selectedOptions.length} / 3`;
      document.getElementById('btnStep3').disabled = selectedOptions.length === 0;
    }

    function saveTimeAndNext() {
      const date = document.getElementById('dateInput').value;
      const time = document.getElementById('timeInput').value;
      if (!date || !time) {
        alert('Выбери дату и время, пожалуйста 🥺');
        return;
      }
      selectedTime = { date, time };
      goToStep(3);
    }

    function goToStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));

      if (step === 'pon') {
        document.getElementById('step-pon').classList.add('active');
        return;
      }

      document.getElementById('step' + step).classList.add('active');

      if (step === 3) {
        renderOptions();
        selectedOptions = [];
        updateSelectedCount();
      }

      if (step === 5) {
        const dateStr = selectedTime.date ? new Date(selectedTime.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '—';
        document.getElementById('sumDate').textContent = `${dateStr} в ${selectedTime.time || '—'}`;

        const labels = selectedOptions.map(id => {
          const opt = options.find(o => o.id === id);
          return opt ? opt.label : id;
        });
        document.getElementById('sumChoices').textContent = labels.length ? labels.join(', ') : '—';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateInput').value = today;
    });
  </script>
</body>
</html>
