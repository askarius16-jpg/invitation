<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тебе приглашение на свидание 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #fff0f5 0%, #e8f4ff 50%, #fff5f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .flower {
      position: fixed;
      width: 70px;
      height: 70px;
      background: #b8e6ff;
      border-radius: 50%;
      opacity: 0.35;
      z-index: 0;
    }
    .flower::before, .flower::after {
      content: '';
      position: absolute;
      width: 45px;
      height: 45px;
      background: #b8e6ff;
      border-radius: 50%;
    }
    .flower::before { top: -25px; left: 12px; }
    .flower::after { top: 12px; left: -25px; }
    .f1 { top: 8%; left: 6%; }
    .f2 { top: 15%; right: 7%; width: 50px; height: 50px; }
    .f3 { bottom: 12%; left: 8%; }
    .f4 { bottom: 20%; right: 5%; width: 55px; height: 55px; }

    .card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(255, 107, 157, 0.18);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card-header {
      background: linear-gradient(135deg, #ff6b9d, #ff4d8d);
      padding: 28px 24px 40px;
      text-align: center;
      color: white;
      position: relative;
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      height: 40px;
      background: white;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .emoji-big { font-size: 56px; margin-bottom: 8px; display: block; }
    .card-header h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
    }

    .card-body {
      padding: 30px 28px 36px;
      text-align: center;
    }
    .to-name {
      font-size: 28px;
      font-weight: 800;
      color: #ff4d8d;
      margin-bottom: 6px;
    }
    .from-name {
      color: #888;
      font-size: 15px;
      margin-bottom: 22px;
    }
    .message {
      background: #fff5f8;
      border-radius: 18px;
      padding: 22px;
      font-size: 17px;
      line-height: 1.55;
      color: #333;
      margin-bottom: 20px;
      position: relative;
    }
    .message::before {
      content: '💌';
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 0 8px;
      font-size: 22px;
    }
    .datetime {
      display: inline-block;
      background: #e8f4ff;
      color: #3a7ca5;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .hearts {
      font-size: 28px;
      letter-spacing: 6px;
      margin-top: 10px;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 13px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="flower f1"></div>
  <div class="flower f2"></div>
  <div class="flower f3"></div>
  <div class="flower f4"></div>

  <div class="card" id="card">
    <div class="card-header">
      <span class="emoji-big" id="genderEmoji">💌</span>
      <h1>Тебе приглашение<br>на свидание!</h1>
    </div>
    <div class="card-body">
      <div class="to-name" id="toName">...</div>
      <div class="from-name">от <span id="fromName">...</span></div>
      <div class="message" id="message">...</div>
      <div class="datetime" id="datetime" style="display:none;"></div>
      <div class="hearts">💗 💕 💗</div>
      <div class="footer-note">Открой сердце... и не только 😉</div>
    </div>
  </div>

  <script>
    try {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('d');
      if (!raw) throw new Error('no data');

      const data = JSON.parse(decodeURIComponent(escape(atob(raw))));

      document.getElementById('toName').textContent = data.to || 'Тебе';
      document.getElementById('fromName').textContent = data.from || 'Тайный поклонник';
      document.getElementById('message').textContent = data.msg || 'Хочу пригласить тебя на свидание ❤️';

      if (data.dt) {
        const dtEl = document.getElementById('datetime');
        dtEl.textContent = '📅 ' + data.dt;
        dtEl.style.display = 'inline-block';
      }

      if (data.g === 'male') {
        document.getElementById('genderEmoji').textContent = '🧔‍♂️💌';
      } else if (data.g === 'female') {
        document.getElementById('genderEmoji').textContent = '👩‍❤️‍👨💌';
      }

      document.title = data.to + ', тебе приглашение! 💌';
    } catch (e) {
      document.getElementById('toName').textContent = 'Ой...';
      document.getElementById('fromName').textContent = 'ошибка';
      document.getElementById('message').textContent = 'Ссылка повреждена или устарела. Попроси прислать новую 💔';
    }
  </script>
</body>
</html>
